<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LCOV Coverage Viewer</title>
    <style>
      @font-face {
        font-family: '0xProto';
        src: url('https://raw.githubusercontent.com/0xType/0xProto/main/fonts/0xProto-Regular.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
      }
      body, pre, code, input, button, select, textarea, header, main, div, span, table, th, td {
        font-family: '0xProto', monospace;
      }
        body { margin:0; padding-top:3.5rem; padding-bottom:30vh; background:#fff; }
      header { position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:1800px; background:#fff; border-bottom:1px solid #ccc; padding:.5rem; display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; z-index:1000; }
      header input[type=text], header input[type=file]{ flex:1; min-width:200px; }
      header button{ padding:.25rem .5rem; }
      header span#status { margin-left:1rem; font-size:.9rem; color:#555; }
      main { padding:1rem; max-width:1800px; margin:0 auto; }
      #summary { display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:1rem; }
      .card { border:1px solid #ccc; border-radius:4px; padding:.5rem 1rem; min-width:120px; }
      table { width:100%; border-collapse:collapse; margin-top:1rem; }
      th, td { padding:.25rem .5rem; border-bottom:1px solid #ddd; text-align:left; }
      th:not(:first-child) { text-align:right; }
      th { position:sticky; top:3.5rem; background:#f9f9f9; }
      th button { background:none; border:none; font:inherit; cursor:pointer; }
      th[aria-sort="ascending"]::after { content:" \25B2"; }
      th[aria-sort="descending"]::after { content:" \25BC"; }
      tr:hover { background:#f0f0f0; }
      tr.details td { background:#fff; }
      td.num { text-align:right; }
      .missed-line { background:#ffcccc; }
      .hit-line { background:#ccffcc; }
      tr.full-coverage { background:#ddffdd; }
      tr.full-coverage:hover { background:#c5ffc5; }
      pre { overflow:auto; }
      .code-line { display:block; margin:0; padding:0.1rem 0; }
      .code-line .ln { color:#888; display:inline-block; min-width:3em; }
      td.file::before { content:""; display:inline-block; width:1.2em; text-align:center; }
      tr.folder td.file { cursor:pointer; font-weight:bold; }
      tr.folder td.file::before { content:"▶"; }
      tr.folder.open td.file::before { content:"▼"; }
      tr.open-file td { background:#e0f7ff; }
      tr.open-file + tr.details td { border-left:4px solid #a3d8ff; }
      @media (max-width:600px) { table { display:block; overflow-x:auto; white-space:nowrap; } th { top:0; } }
    </style>
    <script>
      window["stream/web"] = { ReadableStream, TransformStream, WritableStream };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xz-decompress@0.2.3/dist/package/xz-decompress.js"></script>
  </head>
  <body>
    <header>
      <input id="path" type="text" placeholder="LCOV path" aria-label="LCOV path" />
      <input id="file" type="file" aria-label="LCOV file" />
      <button id="load">Load</button>
      <button id="permalink">Permalink</button>
      <span id="status"></span>
    </header>
    <main>
      <div id="summary"></div>
      <div id="controls">
        <input id="filter" type="text" placeholder="Filter files" aria-label="Filter files" />
      </div>
      <table id="files" aria-describedby="status">
        <thead>
          <tr>
            <th aria-sort="none"><button data-sort="file">File</button></th>
            <th aria-sort="none"><button data-sort="linePct">Lines %</button></th>
            <th aria-sort="none">LH/LF</th>
            <th aria-sort="none"><button data-sort="funcPct">Funcs %</button></th>
            <th aria-sort="none">FNH/FNF</th>
            <th aria-sort="none"><button data-sort="branchPct">Branches %</button></th>
            <th aria-sort="none">BRH/BRF</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="empty">Provide an LCOV file path or upload an LCOV file using the inputs above or <code>?path=...</code> in the URL.</div>
    </main>
    <script type="module">
      const pathInput = document.getElementById('path');
      const fileInput = document.getElementById('file');
      const loadBtn = document.getElementById('load');
      const permalinkBtn = document.getElementById('permalink');
      const statusEl = document.getElementById('status');
      const summaryEl = document.getElementById('summary');
      const filterInput = document.getElementById('filter');
      const tableBody = document.querySelector('#files tbody');
      const emptyEl = document.getElementById('empty');

      const params = new URLSearchParams(location.search);
      pathInput.value = params.get('path') || '';
      filterInput.value = params.get('filter') || '';
      const initialSrcRoot = params.get('srcRoot');
      let srcRoot = initialSrcRoot && /^https?:/i.test(initialSrcRoot) ? initialSrcRoot : '';

      let filesData = [];
      let sortKey = 'file';
      let sortAsc = true;
      let repoSlug = '';

      function status(msg){ statusEl.textContent = msg; }

      loadBtn.addEventListener('click', ()=>{
        params.set('path', pathInput.value.trim());
        if (filterInput.value) params.set('filter', filterInput.value.trim()); else params.delete('filter');
        history.replaceState(null,'', '?' + params.toString());
        load();
      });

      permalinkBtn.addEventListener('click', ()=>{
        if (pathInput.value) params.set('path', pathInput.value.trim()); else params.delete('path');
        if (srcRoot) params.set('srcRoot', srcRoot); else params.delete('srcRoot');
        if (filterInput.value) params.set('filter', filterInput.value.trim()); else params.delete('filter');
        const url = location.origin + location.pathname + '?' + params.toString();
        navigator.clipboard?.writeText(url);
        history.replaceState(null,'', '?' + params.toString());
        status('Permalink copied');
      });

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        params.delete('path');
        history.replaceState(null,'', '?' + params.toString());
        loadFile(file);
      });

      filterInput.addEventListener('input', () => {
        renderTable();
      });

      document.querySelectorAll('th button[data-sort]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const key = btn.dataset.sort;
          if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = key === 'file'; }
          updateSortIndicators();
          renderTable();
        });
      });

      function updateSortIndicators(){
        document.querySelectorAll('th').forEach(th=>th.setAttribute('aria-sort','none'));
        const th = document.querySelector(`th button[data-sort="${sortKey}"]`).parentElement;
        th.setAttribute('aria-sort', sortAsc? 'ascending' : 'descending');
      }

      function normalizePath(p){
        if (!p) throw new Error('Path required');
        if (/^(https?:)?\/\//i.test(p)) throw new Error('Absolute URLs not allowed');
        let path = p;
        if (path.startsWith('/')) {
        } else if (path.startsWith('coverage/')) {
          path = '/' + path;
        } else {
          path = '/coverage/' + path;
        }
        const url = new URL(path, location.origin);
        if (url.origin !== location.origin) throw new Error('Cross-origin path not allowed');
        return url;
      }

      async function fetchText(url){
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        if (url.pathname.endsWith('.xz')){
          const xz = window['xz-decompress'];
          if (!xz?.XzReadableStream) throw new Error('xz not supported in this browser');
          const stream = new xz.XzReadableStream(res.body);
          return await new Response(stream).text();
        }
        if (url.pathname.endsWith('.gz')){
          if (!('DecompressionStream' in window)) throw new Error('gzip not supported in this browser');
          const ds = new DecompressionStream('gzip');
          const stream = res.body.pipeThrough(ds);
          return await new Response(stream).text();
        }
        return await res.text();
      }

      async function readFile(file){
        if (file.name.endsWith('.xz')){
          const xz = window['xz-decompress'];
          if (!xz?.XzReadableStream) throw new Error('xz not supported in this browser');
          const stream = new xz.XzReadableStream(file.stream());
          return await new Response(stream).text();
        }
        if (file.name.endsWith('.gz')){
          if (!('DecompressionStream' in window)) throw new Error('gzip not supported in this browser');
          const ds = new DecompressionStream('gzip');
          const stream = file.stream().pipeThrough(ds);
          return await new Response(stream).text();
        }
        return await file.text();
      }

      function parseLcov(text){
        const files=[]; let current=null;
        const lines=text.split(/\r?\n/);
        for (const line of lines){
          if (!line) continue;
          if (line.startsWith('TN:')){
          } else if (line.startsWith('SF:')){
            if (current) finalize();
            const sfPath = normalizeSourcePath(line.slice(3).trim());
            current = {sf: sfPath, fnDefs:{}, fnHits:{}, lines:{}, branches:[], totals:{}};
          } else if (line.startsWith('FN:')){
            const [ln,name] = line.slice(3).split(',');
            current.fnDefs[name] = Number(ln);
          } else if (line.startsWith('FNDA:')){
            const [hits,name] = line.slice(5).split(',');
            current.fnHits[name] = Number(hits);
          } else if (line.startsWith('DA:')){
            const [ln,count] = line.slice(3).split(',');
            current.lines[Number(ln)] = Number(count);
          } else if (line.startsWith('BRDA:')){
            const [ln,block,br,taken] = line.slice(5).split(',');
            current.branches.push({line:Number(ln), taken: taken === '-'?0:Number(taken)});
          } else if (line.startsWith('LF:')) current.totals.LF = Number(line.slice(3));
          else if (line.startsWith('LH:')) current.totals.LH = Number(line.slice(3));
          else if (line.startsWith('FNF:')) current.totals.FNF = Number(line.slice(4));
          else if (line.startsWith('FNH:')) current.totals.FNH = Number(line.slice(4));
          else if (line.startsWith('BRF:')) current.totals.BRF = Number(line.slice(4));
          else if (line.startsWith('BRH:')) current.totals.BRH = Number(line.slice(4));
          else if (line === 'end_of_record'){ finalize(); current=null; }
        }
        if (current) finalize();
        return files;

        function finalize(){
          const t=current.totals;
          const lineVals=Object.values(current.lines);
          if (t.LF==null) t.LF = Object.keys(current.lines).length;
          if (t.LH==null) t.LH = lineVals.filter(v=>v>0).length;
          const fnNames=Object.keys(current.fnDefs);
          if (t.FNF==null) t.FNF = fnNames.length;
          if (t.FNH==null) t.FNH = fnNames.filter(n=>current.fnHits[n]>0).length;
          if (t.BRF==null) t.BRF = current.branches.length;
          if (t.BRH==null) t.BRH = current.branches.filter(b=>b.taken>0).length;
          current.missed = Object.entries(current.lines).filter(([,c])=>c===0).map(([l])=>Number(l)).sort((a,b)=>a-b);
          files.push(current);
        }
      }

      function pct(hit, found){ return found ? (hit/found*100) : 100; }

      function aggregate(files){
        const total={LF:0,LH:0,FNF:0,FNH:0,BRF:0,BRH:0};
        for (const f of files){
          total.LF+=f.totals.LF; total.LH+=f.totals.LH;
          total.FNF+=f.totals.FNF; total.FNH+=f.totals.FNH;
          total.BRF+=f.totals.BRF; total.BRH+=f.totals.BRH;
        }
        return total;
      }

      function findCommonPrefix(paths){
        if (!paths.length) return '';
        const segs = paths.map(p=> (p ? p.split('/').filter(Boolean) : []));
        const out=[];
        for (let i=0; ; i++){
          const s=segs[0][i];
          if (!s) break;
          if (segs.every(a=>a[i]===s)) out.push(s); else break;
        }
        return out.length? out.join('/') + '/': '';
      }

      function normalizeSourcePath(path){
        return path ? path.replace(/\\/g, '/') : '';
      }

      function cleanPath(path){
        return normalizeSourcePath(path).replace(/^\/+/, '').replace(/^\.\/+/, '');
      }

      function inferRepoSlug(pathVal, files){
        const repoMap = { glues: 'gluesql/glues' };
        const cleaned = normalizeSourcePath(pathVal || '').replace(/^\/+/, '');
        const segments = cleaned.split('/').filter(Boolean);
        if (segments[0] === 'coverage') segments.shift();
        const first = (segments[0] || '').toLowerCase();
        if (repoMap[first]) return repoMap[first];
        for (const f of files || []){
          const sf = f.sf || '';
          const workMatch = sf.match(/\/(?:work|__w)\/([^\/]+)\/\1\//);
          if (workMatch) return `gluesql/${workMatch[1]}`;
          const workspaceMatch = sf.match(/\/github\/workspace\/([^\/]+)\//);
          if (workspaceMatch) return `gluesql/${workspaceMatch[1]}`;
        }
        return 'gluesql/gluesql';
      }

      function resolveRepoPath(path, slug){
        const normalized = cleanPath(path);
        const repoName = (slug || '').split('/')[1] || '';
        if (repoName){
          const needle = `/${repoName}/`;
          const idx = normalized.lastIndexOf(needle);
          if (idx >= 0) return normalized.slice(idx + needle.length);
          if (normalized.startsWith(`${repoName}/`)) return normalized.slice(repoName.length + 1);
        }
        return normalized;
      }

      function slugFromSrcRoot(url){
        if (!url) return '';
        try{
          const parsed = new URL(url);
          const segs = parsed.pathname.split('/').filter(Boolean);
          if (segs.length >= 2) return `${segs[0]}/${segs[1]}`;
        }catch(e){}
        return '';
      }

      function escapeHtml(s){
        return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
      }

      function buildTree(files){
        const root={name:'',children:{}};
        for(const f of files){
          const parts=f.display.split('/');
          let node=root;
          for(const part of parts){
            if(!node.children[part]){
              node.children[part]={name:part,children:{},totals:{LF:0,LH:0,FNF:0,FNH:0,BRF:0,BRH:0}};
            }
            const t=node.children[part].totals;
            t.LF+=f.totals.LF; t.LH+=f.totals.LH;
            t.FNF+=f.totals.FNF; t.FNH+=f.totals.FNH;
            t.BRF+=f.totals.BRF; t.BRH+=f.totals.BRH;
            node=node.children[part];
          }
          node.file=f;
        }
        return root;
      }

      function renderTree(node,parentPath='',depth=0){
        const entries=Object.entries(node.children).sort((a,b)=>a[0].localeCompare(b[0]));
        for(const [name,child] of entries){
          const full=parentPath? parentPath+'/'+name : name;
          if(child.file){
            const tr=document.createElement('tr');
            if(child.file.linePct >= 100) tr.classList.add('full-coverage');
            tr.dataset.parent=parentPath;
            tr.innerHTML=`<td class="file" style="padding-left:${depth*1.25}rem">${escapeHtml(name)}</td>`+
              `<td class="num">${child.file.linePct.toFixed(1)}%</td><td class="num">${child.file.totals.LH}/${child.file.totals.LF}</td>`+
              `<td class="num">${child.file.funcPct.toFixed(1)}%</td><td class="num">${child.file.totals.FNH}/${child.file.totals.FNF}</td>`+
              `<td class="num">${child.file.branchPct.toFixed(1)}%</td><td class="num">${child.file.totals.BRH}/${child.file.totals.BRF}</td>`;
            tr.addEventListener('click',()=>toggleDetails(tr,child.file));
            if(parentPath) tr.style.display='none';
            tableBody.appendChild(tr);
          }else{
            const linePct=pct(child.totals.LH,child.totals.LF);
            const funcPct=pct(child.totals.FNH,child.totals.FNF);
            const branchPct=pct(child.totals.BRH,child.totals.BRF);
            const tr=document.createElement('tr');
            tr.className='folder';
            if(linePct >= 100) tr.classList.add('full-coverage');
            tr.dataset.path=full;
            tr.dataset.parent=parentPath;
            tr.innerHTML=`<td class="file" style="padding-left:${depth*1.25}rem">${escapeHtml(name)}</td>`+
              `<td class="num">${linePct.toFixed(1)}%</td><td class="num">${child.totals.LH}/${child.totals.LF}</td>`+
              `<td class="num">${funcPct.toFixed(1)}%</td><td class="num">${child.totals.FNH}/${child.totals.FNF}</td>`+
              `<td class="num">${branchPct.toFixed(1)}%</td><td class="num">${child.totals.BRH}/${child.totals.BRF}</td>`;
            tr.addEventListener('click',()=>toggleFolder(full));
            if(parentPath) tr.style.display='none';
            tableBody.appendChild(tr);
            renderTree(child,full,depth+1);
          }
        }
      }

      function toggleFolder(path){
        const row=tableBody.querySelector(`tr[data-path="${path}"]`);
        const open=row.classList.toggle('open');
        const rows=tableBody.querySelectorAll('tr[data-parent]');
        for(const r of rows){
          if(r.dataset.parent===path || r.dataset.parent.startsWith(path+'/')){
            if(open){
              let p=r.dataset.parent;
              let visible=true;
              while(p){
                const anc=tableBody.querySelector(`tr[data-path="${p}"]`);
                if(anc && !anc.classList.contains('open')){ visible=false; break; }
                const idx=p.lastIndexOf('/');
                if(idx<0) break;
                p=p.slice(0,idx);
              }
              if(visible) r.style.display='';
            }else{
              r.style.display='none';
              if(r.classList.contains('folder')) r.classList.remove('open');
              r.classList.remove('open-file');
              const next=r.nextElementSibling;
              if(next && next.classList.contains('details')) next.remove();
            }
          }
        }
      }

      function renderSummary(){
        const t=aggregate(filesData);
        summaryEl.innerHTML=`
          <div class="card">Lines: ${t.LH}/${t.LF} (${pct(t.LH,t.LF).toFixed(1)}%)</div>
          <div class="card">Funcs: ${t.FNH}/${t.FNF} (${pct(t.FNH,t.FNF).toFixed(1)}%)</div>
          <div class="card">Branches: ${t.BRH}/${t.BRF} (${pct(t.BRH,t.BRF).toFixed(1)}%)</div>`;
      }

      function renderTable(){
        tableBody.innerHTML='';
        if (!filesData.length){ emptyEl.style.display='block'; return; }
        emptyEl.style.display='none';
        const filter = filterInput.value.toLowerCase();
        let data = filesData.map(f=>{
          let repoPath = resolveRepoPath(f.sf, repoSlug);
          if (!repoPath) repoPath = cleanPath(f.sf);
          return {
            ...f,
            repoPath,
            linePct: pct(f.totals.LH,f.totals.LF),
            funcPct: pct(f.totals.FNH,f.totals.FNF),
            branchPct: pct(f.totals.BRH,f.totals.BRF)
          };
        });
        const prefix = findCommonPrefix(data.map(f=>f.repoPath));
        data = data.map(f=>{
          let display = f.repoPath;
          if (prefix && display.startsWith(prefix)) display = display.slice(prefix.length);
          if (!display) display = f.repoPath;
          if (!display) display = cleanPath(f.sf) || f.sf || '';
          return {
            ...f,
            display
          };
        });
        if(filter) data = data.filter(f=>{
          const displayLower = f.display.toLowerCase();
          const repoLower = (f.repoPath || '').toLowerCase();
          return displayLower.includes(filter) || repoLower.includes(filter);
        });
        data.sort((a,b)=>{
          let va,vb;
          switch(sortKey){
            case 'file': va=a.display.toLowerCase(); vb=b.display.toLowerCase(); return va<vb? (sortAsc?-1:1) : va>vb? (sortAsc?1:-1):0;
            case 'linePct': va=a.linePct; vb=b.linePct; break;
            case 'funcPct': va=a.funcPct; vb=b.funcPct; break;
            case 'branchPct': va=a.branchPct; vb=b.branchPct; break;
          }
          return sortAsc? va-vb : vb-va;
        });
        const tree = buildTree(data);
        renderTree(tree);
      }

      async function toggleDetails(tr,file){
        const next=tr.nextElementSibling;
        if (next && next.classList.contains('details')){ next.remove(); tr.classList.remove('open-file'); return; }
        const detail=document.createElement('tr');
        detail.className='details';
        const td=document.createElement('td');
        td.colSpan=7;
        td.innerHTML=`<div class="detail">
          <div>Lines: ${file.totals.LH}/${file.totals.LF} (${pct(file.totals.LH,file.totals.LF).toFixed(1)}%)</div>
          <div>Funcs: ${file.totals.FNH}/${file.totals.FNF} (${pct(file.totals.FNH,file.totals.FNF).toFixed(1)}%)</div>
          <div>Branches: ${file.totals.BRH}/${file.totals.BRF} (${pct(file.totals.BRH,file.totals.BRF).toFixed(1)}%)</div>
          <details class="missed"><summary>Missed lines (${file.missed.length})</summary><div class="missed-list"></div></details>
          <div class="source"></div>
        </div>`;
        detail.appendChild(td);
        tr.after(detail);
        tr.classList.add('open-file');
        td.querySelector('.missed-list').textContent = file.missed.join(', ') || 'None';
        if (srcRoot){
          const srcDiv=td.querySelector('.source');
          srcDiv.textContent='Loading source...';
          try{
            const rawPath = file.repoPath || file.display || file.sf || '';
            const relative = normalizeSourcePath(rawPath).replace(/^\/+/,'').replace(/^\.\/+/,'');
            if (!relative) throw new Error('Missing relative path');
            const url=new URL(relative, srcRoot);
            const res=await fetch(url);
            if(!res.ok) throw new Error('HTTP '+res.status);
            const text=await res.text();
            srcDiv.innerHTML=renderSource(text, file.lines);
          }catch(e){
            srcDiv.textContent='Failed to load source';
          }
        }
      }

      function renderSource(text, lineHits){
        const { value } = hljs.highlightAuto(text);
        const lines=value.split(/\r?\n/);
        const width=String(lines.length).length;
        const html=lines.map((line,i)=>{
          const num=String(i+1).padStart(width,' ');
          const count=lineHits[i+1];
          const cls=count===0? 'missed-line' : count>0? 'hit-line' : '';
          const content=line || '&nbsp;';
          return `<code class="code-line ${cls}"><span class="ln">${num}</span> ${content}</code>`;
        }).join('');
        return `<pre class="hljs">${html}</pre>`;
      }

      async function load(){
        let pathVal=pathInput.value.trim();
        if(!pathVal){ status('Path required'); filesData=[]; repoSlug=''; renderSummary(); renderTable(); return; }
        try{ pathVal = decodeURIComponent(pathVal); }catch{}
        let inferredCommit='';
        const srcRootParamValue = params.get('srcRoot');
        const hasSrcRootParam = !!(srcRootParamValue && /^https?:/i.test(srcRootParamValue));
        if(hasSrcRootParam){
          srcRoot = srcRootParamValue;
        }else{
          // Match commit hash in filenames like {timestamp}.{hash}.lcov.info or {hash}-lcov.info[.xz]
          const m=pathVal.match(/([0-9a-fA-F]{40})(?=[^\/]*[.-]lcov\.info(?:\.xz)?$)/);
          inferredCommit = m ? m[1] : '';
          srcRoot = '';
        }
        status('Loading...');
        try{
          const url=normalizePath(pathVal);
          const text=await fetchText(url);
          filesData=parseLcov(text);
          const inferredSlug = inferRepoSlug(pathVal, filesData);
          if (hasSrcRootParam){
            repoSlug = slugFromSrcRoot(srcRootParamValue) || inferredSlug;
          }else{
            repoSlug = inferredSlug;
            srcRoot = inferredCommit ? `https://raw.githubusercontent.com/${repoSlug}/${inferredCommit}/` : '';
          }
          renderSummary();
          renderTable();
          status('Loaded '+url.pathname);
        }catch(e){
          filesData=[]; repoSlug=''; renderSummary(); renderTable();
          status('Error: '+e.message);
        }
      }

      async function loadFile(file){
        pathInput.value=''; srcRoot='';
        status('Loading...');
        try{
          const text=await readFile(file);
          filesData=parseLcov(text);
          repoSlug='';
          renderSummary();
          renderTable();
          status('Loaded '+file.name);
        }catch(e){
          filesData=[]; repoSlug=''; renderSummary(); renderTable();
          status('Error: '+e.message);
        }
      }

      if (pathInput.value){ load(); } else { status('Enter LCOV path'); }
      updateSortIndicators();
    </script>
  </body>
</html>
